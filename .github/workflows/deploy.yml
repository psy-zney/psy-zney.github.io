name: Deploy Vite project to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check preserved features
        run: pnpm run check:portfolio && pnpm run check:experience

      - name: Build
        env:
          VITE_DEPLOY_VERSION: ${{ github.sha }}
          VITE_MONGO_API_ENDPOINT: ${{ secrets.VITE_MONGO_API_ENDPOINT }}
          VITE_ADMIN_PASS_HASH: ${{ secrets.VITE_ADMIN_PASS_HASH }}
          VITE_ANALYTICS_URL: ${{ secrets.VITE_ANALYTICS_URL }}
        run: pnpm run build

      - name: Verify deployment cache artifacts
        run: node scripts/check-deployment-cache.mjs --static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
